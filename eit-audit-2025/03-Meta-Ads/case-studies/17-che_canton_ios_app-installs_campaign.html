async function decryptWith(p){
  const enc=new TextEncoder();
  const salt=Uint8Array.from(atob(S),c=>c.charCodeAt(0));
  const iv=Uint8Array.from(atob(I),c=>c.charCodeAt(0));
  const ct=Uint8Array.from(atob(C),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const dec=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
  return new TextDecoder("utf-8").decode(dec);
}

async function dec(){
  document.getElementById("err").style.display="none";
  document.getElementById("btn").disabled=true;
  document.getElementById("spin").style.display="block";
  try{
    const p=document.getElementById("pw").value;
    const html=await decryptWith(p);
    sessionStorage.setItem("eitPwd", p);
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById("spin").style.display="none";
    document.getElementById("btn").disabled=false;
    document.getElementById("err").style.display="block";
    document.getElementById("pw").focus();
  }
}

(async()=>{
  const stored=sessionStorage.getItem("eitPwd");
  if(stored){
    try{
      const html=await decryptWith(stored);
      document.open();document.write(html);document.close();
      return;
    }catch(e){
      sessionStorage.removeItem("eitPwd");
    }
  }
  document.getElementById("autoSpin").style.display="none";
  document.getElementById("loginPanel").style.display="block";
  document.getElementById("pw").focus();
})();

document.addEventListener("keypress", e => {
  if(e.key === "Enter" && document.activeElement && document.activeElement.id === "pw") dec();
});
