function b2a(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
async function dec(pw){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b2a(SALT),iterations:100000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(IV)},k,b2a(CT));
  return new TextDecoder().decode(pt);
}
async function go(){
  var pw=document.getElementById("pw").value;
  try{
    var html=await dec(pw);
    sessionStorage.setItem("sky_pw",pw);
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById("err").textContent="Wrong password.";}
}
(async function(){
  var saved=sessionStorage.getItem("sky_pw");
  if(saved){try{var html=await dec(saved);document.open();document.write(html);document.close();}catch(e){}}
})();
