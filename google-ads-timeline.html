async function decrypt(){
  document.getElementById("err").style.display="none";
  document.getElementById("spin").style.display="block";
  document.getElementById("btn").disabled=true;
  try{
    var p=document.getElementById("pw").value;
    var enc=new TextEncoder();
    var salt=Uint8Array.from(atob(S),c=>c.charCodeAt(0));
    var iv=Uint8Array.from(atob(I),c=>c.charCodeAt(0));
    var ct=Uint8Array.from(atob(C),c=>c.charCodeAt(0));
    var km=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    var dec=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
    var html=new TextDecoder("utf-8").decode(dec);
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById("spin").style.display="none";
    document.getElementById("btn").disabled=false;
    document.getElementById("err").style.display="block";
  }
  return false;
}
